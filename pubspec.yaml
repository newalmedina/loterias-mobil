name: loterymobile
description: Aplicación Flutter de lotería
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter

    flutter_localizations:
        sdk: flutter

    intl: ^0.20.2
    http: ^1.2.0
    shared_preferences: ^2.2.2
    cupertino_icons: ^1.0.8

    local_auth: ^2.2.1
    flutter_secure_storage: ^8.0.0
    flutter_svg: ^2.0.10
    mobile_scanner: ^5.2.3

    share_plus: ^10.0.0
    path_provider: ^2.1.4

    flutter_blue_plus: ^1.35.0
    esc_pos_utils: ^1.1.0

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^4.0.0
    flutter_launcher_icons: ^0.11.0

flutter_launcher_icons:
    android: true
    ios: true
    image_path: assets/icon.png

flutter:
    uses-material-design: true

    assets:
        - assets/images/logo.png
